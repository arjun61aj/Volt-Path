{% extends 'base.html' %}{% block title %}Registration status{% endblock %}{% block content %}<section class="auth-page"><div class="auth-card status-card"><span class="eyebrow">APPLICATION TRACKING</span><h1>Check registration status</h1><p>Enter the registration ID and the operator email used during submission.</p><form method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>Registration ID</label><input class="text-input" name="registration_id" placeholder="REG00001" required><label>Operator email</label><input class="text-input" type="email" name="email" required><button class="primary-btn">Check status <b>→</b></button></form><small>Matching both values prevents casual access to submission status.</small></div></section>{% endblock %}
